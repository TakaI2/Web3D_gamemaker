<!DOCTYPE html>
<html lang="ja">
<head>
  <title>Entry Editor — 建物の玄関・窓マーカー</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101522; color: #e6ecf5; font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #topbar { position: fixed; top: 8px; left: 8px; z-index: 20; }
    #topbar a { background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 6px 12px; border-radius: 4px; font-size: 12px; text-decoration: none; }
    #panel { position: fixed; top: 8px; right: 8px; z-index: 20; width: 240px; background: rgba(12,16,28,0.92); border: 1px solid #2a3756; border-radius: 8px; padding: 12px; font-size: 12px; display: flex; flex-direction: column; gap: 8px; }
    #panel h3 { margin: 0; font-size: 13px; color: #9fd0ff; }
    select, button { background: #1a2438; color: #e6ecf5; border: 1px solid #2a3756; border-radius: 4px; padding: 5px 8px; font-size: 12px; }
    button { background: #2b4a80; border: none; cursor: pointer; }
    button.sub { background: #24314f; }
    .row { display: flex; gap: 6px; } .row > * { flex: 1; }
    #status { position: fixed; top: 8px; left: 50%; transform: translateX(-50%); z-index: 20; background: rgba(0,0,0,0.55); color: #cfe; padding: 6px 12px; border-radius: 4px; font-size: 12px; }
    #hint { position: fixed; bottom: 8px; left: 8px; z-index: 20; background: rgba(0,0,0,0.5); color: #9ab; padding: 6px 10px; border-radius: 4px; font-size: 11px; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="topbar"><a href="../hub/">← 一覧</a></div>
  <div id="status">読み込み中…</div>
  <div id="panel">
    <h3>建物モデル</h3>
    <select id="model-list" size="10"></select>
    <h3>マーカー種別</h3>
    <div class="row">
      <select id="marker-kind">
        <option value="door">玄関 (橙)</option>
        <option value="window">窓 (水色)</option>
        <option value="light">光点 (黄・夜ランプ)</option>
        <option value="glow">窓発光 (面・夜光漏れ)</option>
        <option value="sign">看板 (面・広告)</option>
      </select>
      <button id="btn-del" class="sub">選択削除</button>
    </div>
    <div id="sign-opts" style="display:none;flex-direction:column;gap:6px;">
      <div class="row">
        <label style="flex:0 0 auto;align-self:center;color:#9ab;">幅×高</label>
        <input type="number" id="sign-w" step="0.05" min="0.05" value="0.6" style="width:56px;background:#1a2438;color:#e6ecf5;border:1px solid #2a3756;border-radius:4px;padding:4px;">
        <input type="number" id="sign-h" step="0.05" min="0.05" value="0.25" style="width:56px;background:#1a2438;color:#e6ecf5;border:1px solid #2a3756;border-radius:4px;padding:4px;">
      </div>
      <div class="row">
        <label style="flex:0 0 auto;align-self:center;color:#9ab;" title="public/advertise/&lt;セット名&gt;/ の画像がランダムに割り当てられる">セット</label>
        <input type="text" id="sign-set" value="" style="flex:1;min-width:0;background:#1a2438;color:#e6ecf5;border:1px solid #2a3756;border-radius:4px;padding:4px;">
        <label style="flex:0 0 auto;align-self:center;color:#9ab;" title="看板1枚ごとに別フォルダ（building-f-1, -2 …）を自動で割り当てる。外すとセット名欄をそのまま使う＝複数の看板で画像プールを共有"><input type="checkbox" id="sign-auto" checked style="vertical-align:middle;">自動</label>
      </div>
      <div class="row">
        <select id="sign-res" title="生成するテンプレートPNGの長辺">
          <option value="256">256px</option>
          <option value="512" selected>512px</option>
          <option value="1024">1024px</option>
        </select>
        <button id="btn-tex-new" class="sub" title="この矩形の縦横比に合わせた白紙PNGを advertise/&lt;セット名&gt;/ に作る">テンプレ作成</button>
      </div>
      <div class="row">
        <button id="btn-tex-reload" class="sub" title="ペイントソフトで保存した画像を読み直す">画像を再読込</button>
      </div>
      <div id="sign-files" style="color:#8fa; font-size:11px; line-height:1.5;"></div>
    </div>
    <div class="row" id="gizmo-row">
      <label style="flex:0 0 auto;align-self:center;color:#9ab;">ギズモ</label>
      <button id="btn-gz-move" class="sub">移動</button>
      <button id="btn-gz-rot" class="sub">回転</button>
      <button id="btn-gz-off" class="sub">なし</button>
    </div>
    <div class="row" id="light-opts" style="display:none;">
      <label style="flex:0 0 auto;align-self:center;color:#9ab;">色</label>
      <select id="light-color">
        <option value="">自動 (赤/青/橙)</option>
        <option value="#ff3020">赤</option>
        <option value="#3060ff">青</option>
        <option value="#ffa030">橙</option>
        <option value="#ffffff">白</option>
      </select>
      <label style="flex:0 0 auto;align-self:center;color:#9ab;" title="点滅の周期（秒）。0=常時点灯">点滅s</label>
      <input type="number" id="light-blink" step="0.1" min="0" value="0" style="width:52px;background:#1a2438;color:#e6ecf5;border:1px solid #2a3756;border-radius:4px;padding:4px;">
    </div>
    <div class="row" id="glow-opts" style="display:none;">
      <label style="flex:0 0 auto;align-self:center;color:#9ab;">幅×高</label>
      <input type="number" id="glow-w" step="0.05" min="0.05" value="0.3" style="width:60px;background:#1a2438;color:#e6ecf5;border:1px solid #2a3756;border-radius:4px;padding:4px;">
      <input type="number" id="glow-h" step="0.05" min="0.05" value="0.4" style="width:60px;background:#1a2438;color:#e6ecf5;border:1px solid #2a3756;border-radius:4px;padding:4px;">
    </div>
    <button id="btn-save">全モデル分を保存</button>
  </div>
  <div id="hint"><b>建物クリック</b>でマーカー設置 / <b>マーカークリック</b>で選択→削除 / <b>窓発光・看板</b>はクリック面の向きに矩形を貼る（幅×高で調整） / 選択中は<b>Delete</b>で削除 / <b>ギズモ</b>で移動・回転（G/R/Escで切替、<b>Shift</b>押しながらで45度刻み） / ドラッグで視点<br><b>看板</b>: 置いて位置を決めたら<b>「全モデル分を保存」</b>→ 画像が無い看板の白紙テンプレ public/advertise/&lt;セット名&gt;/uv1.png がまとめて作られる。ペイントソフトで編集→「画像を再読込」／同じ看板の柄違いを増やすときは「テンプレ作成」で uv2, uv3 を追加</div>
  <script type="module" src="./entry-editor.js"></script>
</body>
</html>
