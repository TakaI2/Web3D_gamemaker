<!DOCTYPE html>
<html lang="ja">
<head>
  <title>Paint Editor — 生成オブジェクトの色分け</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101522; color: #e6ecf5; font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #topbar { position: fixed; top: 8px; left: 8px; z-index: 20; display: flex; gap: 8px; align-items: center; }
    #topbar a, #topbar span { background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 6px 12px; border-radius: 4px; font-size: 12px; text-decoration: none; }
    #panel {
      position: fixed; top: 8px; right: 8px; z-index: 20; width: 280px;
      background: rgba(12,16,28,0.94); border: 1px solid #2a3756; border-radius: 8px;
      padding: 12px; font-size: 12px; display: flex; flex-direction: column; gap: 10px;
      max-height: calc(100vh - 16px); overflow-y: auto;
    }
    #panel h3 { margin: 0; font-size: 13px; color: #9fd0ff; }
    #panel .hint { color: #8fa2bd; line-height: 1.5; }
    #panel select { width: 100%; background: #1a2438; color: #e6ecf5; border: 1px solid #2a3756; border-radius: 4px; padding: 5px 6px; font-size: 12px; }
    #panel button { background: #2b4a80; color: #fff; border: none; border-radius: 4px; padding: 7px 10px; font-size: 12px; cursor: pointer; }
    #panel button:hover { background: #3a5fa0; }
    #panel button.sub { background: #24314f; }
    #panel button.on { background: #3a7a4a; }
    .sep { border-top: 1px solid #2a3756; margin: 2px 0; }
    .row { display: flex; gap: 6px; align-items: center; }
    #legacySwatches .swatchRow { display: flex; align-items: center; gap: 8px; }
    #legacySwatches .swatchRow span { flex: 1; }
    #legacySwatches input[type=color] { width: 40px; height: 26px; border: none; border-radius: 4px; padding: 0; background: none; cursor: pointer; }
    #palette { display: flex; flex-wrap: wrap; gap: 6px; }
    #palette .sw { width: 28px; height: 28px; border-radius: 5px; border: 2px solid transparent; cursor: pointer; }
    #palette .sw.cur { border-color: #fff; }
    #paletteAdd { display: flex; gap: 6px; align-items: center; }
    #paletteAdd input[type=color] { width: 36px; height: 26px; border: none; border-radius: 4px; padding: 0; background: none; cursor: pointer; }
    #brush { display: flex; gap: 6px; }
    #brush button { flex: 1; }
    #info { color: #ffd76a; min-height: 1.2em; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="topbar"><a href="../hub/">← 一覧</a><span>Paint Editor</span></div>
  <div id="panel">
    <h3>対象</h3>
    <select id="obj"></select>
    <div id="meta" class="hint"></div>

    <div id="legacySwatches" style="display:none">
      <div class="sep"></div>
      <h3>色（旧戦闘機・3系統）</h3>
      <div class="swatchRow"><span>本体</span><input type="color" id="lgBody"></div>
      <div class="swatchRow"><span>アクセント</span><input type="color" id="lgAccent"></div>
      <div class="swatchRow"><span>コクピット発光</span><input type="color" id="lgGlow"></div>
      <button id="saveLegacy">jet-colors.json に保存</button>
    </div>

    <div id="paintPanel" style="display:none">
      <div class="sep"></div>
      <h3>面ペイント</h3>
      <div class="hint">クリック／ドラッグで面を塗る。右クリックはスポイト。</div>
      <div id="palette"></div>
      <div id="paletteAdd"><input type="color" id="newColor" value="#16121e"><button id="addColor" class="sub">パレットに追加</button></div>
      <div id="brush">
        <button id="glowOff" class="on">通常</button>
        <button id="glowOn">発光で塗る</button>
      </div>
      <div class="sep"></div>
      <button id="flip180" class="sub">前後反転（機首とテール入替）</button>
      <button id="resetPaint" class="sub">全面リセット</button>
      <button id="savePaint">paint.json に保存</button>
    </div>

    <div id="info"></div>
  </div>
  <script type="module" src="./paint-editor.js"></script>
</body>
</html>
