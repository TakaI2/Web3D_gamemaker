<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>Talk Editor — City-Fly ゲーム内会話</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #14161f; color: #dde; font: 13px Meiryo, sans-serif; height: 100vh; display: flex; flex-direction: column; }
    #topbar { display: flex; gap: 8px; align-items: center; padding: 8px 12px; background: #1b1e2c; border-bottom: 1px solid #2a2e44; }
    #topbar .title { font-weight: 700; margin-right: 8px; }
    button, select, input, textarea { background: #222636; border: 1px solid #3a3f60; color: #dde; border-radius: 4px; padding: 4px 8px; font: 12px Meiryo, sans-serif; }
    button { cursor: pointer; }
    button.prim { background: #2c4a8a; border-color: #4a6ab0; }
    button.mini { padding: 1px 6px; font-size: 11px; }
    #main { flex: 1; display: flex; min-height: 0; }
    .col { display: flex; flex-direction: column; min-height: 0; border-right: 1px solid #2a2e44; }
    #col-talks { width: 200px; }
    #col-lines { flex: 1; }
    #col-right { width: 320px; border-right: none; }
    .col h3 { margin: 0; padding: 8px 10px; font-size: 12px; color: #9ab; background: #191c2a; border-bottom: 1px solid #2a2e44; display: flex; justify-content: space-between; align-items: center; }
    .scroll { flex: 1; overflow-y: auto; padding: 6px; }
    .talk-row { padding: 6px 8px; border-radius: 4px; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
    .talk-row:hover { background: #222636; }
    .talk-row.active { background: #2c4a8a; }
    .line-card { background: #1b1e2c; border: 1px solid #2a2e44; border-radius: 6px; padding: 6px 8px; margin-bottom: 6px; display: flex; gap: 6px; align-items: flex-start; }
    .line-card .who { width: 110px; }
    .line-card .face { width: 90px; }
    .line-card textarea { flex: 1; resize: vertical; min-height: 2.4em; }
    .line-card .ops { display: flex; flex-direction: column; gap: 2px; }
    .actor-row { display: flex; gap: 4px; margin-bottom: 4px; align-items: center; }
    .actor-row input.aid { width: 70px; }
    .actor-row input.aname { width: 90px; }
    .actor-row input.acolor { width: 44px; padding: 1px; height: 24px; }
    .actor-row input.avrm { width: 100%; margin-top: 2px; font-size: 11px; }
    .actor-row { flex-wrap: wrap; }
    #preview-box { border-top: 1px solid #2a2e44; padding: 10px; background: #10121b; }
    #pv-window { background: rgba(8,10,24,0.92); border: 1px solid rgba(140,150,255,0.45); border-radius: 10px; padding: 10px 14px; display: flex; gap: 12px; align-items: center; box-shadow: 0 4px 18px rgba(0,0,0,0.5); min-height: 112px; }
    #pv-face { width: 92px; height: 92px; flex: 0 0 92px; border-radius: 8px; overflow: hidden; position: relative; background: #223; }
    #pv-face .fb { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font: 900 44px Meiryo, sans-serif; color: #fff; }
    #pv-face img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
    #pv-name { font: 700 14px Meiryo, sans-serif; margin-bottom: 4px; }
    #pv-text { font: 16px/1.6 Meiryo, sans-serif; color: #eef; min-height: 3.2em; }
    #toast { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); background: #2c4a8a; padding: 8px 18px; border-radius: 6px; opacity: 0; transition: opacity 0.3s; pointer-events: none; }
    #toast.show { opacity: 1; }
    .hint { color: #667; font-size: 11px; padding: 4px 10px; }
  </style>
</head>
<body>
  <div id="topbar">
    <span class="title">Talk Editor <span style="color:#89f;font-size:11px">City-Fly 会話</span></span>
    <select id="talk-file" title="編集するステージの会話ファイル" style="background:#242a3d;color:#dde;border:1px solid #3a4160;border-radius:4px;padding:5px 8px;"></select>
    <button id="btn-reload">再読込</button>
    <button id="btn-save" class="prim">保存</button>
    <span style="flex:1"></span>
    <a href="../hub/" style="color:#9ab">← 一覧</a>
  </div>
  <div id="main">
    <div class="col" id="col-talks">
      <h3>会話ID <button class="mini" id="btn-add-talk">＋</button></h3>
      <div class="scroll" id="talk-list"></div>
      <div class="hint">イベント(events.json)の talk から参照されるID</div>
    </div>
    <div class="col" id="col-lines">
      <h3><span id="lines-title">行（未選択）</span>
        <span>
          <button class="mini" id="btn-rename">ID変更</button>
          <button class="mini" id="btn-del-talk">会話を削除</button>
          <button class="mini" id="btn-add-line">＋行を追加</button>
        </span></h3>
      <div class="scroll" id="line-list"></div>
    </div>
    <div class="col" id="col-right">
      <h3>話者マスタ <button class="mini" id="btn-add-actor">＋</button></h3>
      <div class="scroll" id="actor-list" style="flex:0 0 auto; max-height: 220px;"></div>
      <div class="hint">顔グラ: scenario2d/face/&lt;話者ID&gt;/&lt;表情&gt;.png（無ければイニシャル仮表示）</div>
      <div style="flex:1"></div>
      <div id="preview-box">
        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
          <span style="color:#9ab; font-size:12px;">プレビュー</span>
          <span><button class="mini" id="btn-play">▶ 再生</button><button class="mini" id="btn-stop">⏹</button></span>
        </div>
        <div id="pv-window">
          <div id="pv-face"><div class="fb">？</div><img alt="" /></div>
          <div style="flex:1; min-width:0;">
            <div id="pv-name">—</div>
            <div id="pv-text">行を選択するとここに表示</div>
          </div>
        </div>
      </div>
    </div>
  </div>
  <datalist id="face-presets">
    <option value="normal"></option><option value="smile"></option><option value="angry"></option>
    <option value="panic"></option><option value="worry"></option><option value="weak"></option><option value="damage"></option>
  </datalist>
  <div id="toast"></div>
  <script type="module" src="./talk-editor.js"></script>
</body>
</html>
