<!DOCTYPE html>
<html lang="ja">
<head>
  <title>マント付きNPC (megu) — CPUクロス / WebXR</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #1a1a2e; font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #back { position: fixed; top: 10px; left: 10px; z-index: 10; background: rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.3); color: #fff; padding: 6px 12px; border-radius: 4px; font-size: 12px; text-decoration: none; }
    #status { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); z-index: 10; background: rgba(0,0,0,0.55); color: #cfe; padding: 6px 12px; border-radius: 4px; font-size: 12px; }
    #hud { position: fixed; top: 10px; right: 10px; z-index: 10; background: rgba(12,16,28,0.9); border: 1px solid #2a3756; border-radius: 8px; padding: 12px 14px; color: #e6ecf5; font-size: 13px; min-width: 170px; }
    #hud-label { font-weight: bold; color: #9fd0ff; margin-bottom: 6px; }
    #hud .row { display: flex; justify-content: space-between; margin: 4px 0; color: #cde; }
    #hud-fps { color: #8f8; font-family: monospace; }
    #hud .sl { display: block; margin: 5px 0; color: #bcd; font-size: 12px; }
    #hud .sl input { width: 100%; }
    #hud .sl span { color: #7fd7ff; font-family: monospace; float: right; }
  </style>
</head>
<body>
  <div id="app"></div>
  <a id="back" href="../hub/">← 一覧</a>
  <div id="status">読み込み中…</div>
  <div id="hud">
    <div id="hud-label">マント付きNPC ARエディタ</div>
    <div class="row"><span>FPS</span><span id="hud-fps">--</span></div>
    <div class="row"><span>マント</span><span id="hud-verts">--</span></div>
    <label style="display:block;margin-top:8px;color:#9ab;">表示NPC
      <select id="npc-sel" style="width:100%;margin-top:3px;padding:4px;background:#1a2438;border:1px solid #2a3756;border-radius:4px;color:#fff;">
        <option value="JOY_vamp">JOY_vamp</option>
      </select>
    </label>
    <label style="display:block;margin-top:6px;color:#9ab;">演技（アニメ）
      <select id="perf-sel" style="width:100%;margin-top:3px;padding:4px;background:#1a2438;border:1px solid #2a3756;border-radius:4px;color:#fff;"></select>
    </label>
    <div style="margin-top:8px;border-top:1px solid #2a3756;padding-top:6px;color:#9fd0ff;font-size:12px;">マント素材</div>
    <label class="sl">粗さ <span id="val-rough">0.45</span><input type="range" id="sl-rough" min="0" max="1" step="0.01" value="0.45"></label>
    <label class="sl">光沢 <span id="val-sheen">1.00</span><input type="range" id="sl-sheen" min="0" max="1" step="0.05" value="1"></label>
    <label class="sl">透明度 <span id="val-opac">1.00</span><input type="range" id="sl-opac" min="0.2" max="1" step="0.05" value="1"></label>
    <label class="sl">環境光 <span id="val-env">1.00</span><input type="range" id="sl-env" min="0" max="2" step="0.05" value="1"></label>
    <label style="display:flex;align-items:center;gap:6px;margin-top:6px;"><input type="checkbox" id="cb-cape" checked> マント表示</label>
    <label style="display:flex;align-items:center;gap:6px;"><input type="checkbox" id="cb-wire"> ワイヤーフレーム</label>
    <div style="margin-top:8px;border-top:1px solid #2a3756;padding-top:6px;color:#9fd0ff;font-size:12px;">配置</div>
    <label class="sl">向き° <span id="val-yaw">0</span><input type="range" id="sl-yaw" min="-180" max="180" step="5" value="0"></label>
    <label class="sl">左右 <span id="val-x">0.00</span><input type="range" id="sl-x" min="-2" max="2" step="0.05" value="0"></label>
    <label class="sl">前後 <span id="val-z">0.00</span><input type="range" id="sl-z" min="-2" max="2" step="0.05" value="0"></label>
  </div>
  <div id="err" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:99;max-height:45%;overflow:auto;background:rgba(40,0,0,0.92);color:#fbb;font:12px monospace;padding:14px;white-space:pre-wrap;"></div>
  <script>
    window.addEventListener('error', function (e) {
      var msg = e && e.message ? e.message : (e && e.target && (e.target.src || e.target.href) ? '読み込み失敗: ' + (e.target.src || e.target.href) : String(e));
      var d = document.getElementById('err'); if (!d) return;
      d.style.display = 'block';
      var ln = document.createElement('div'); ln.textContent = '⚠ ' + msg; d.appendChild(ln);
    }, true);
    window.addEventListener('unhandledrejection', function (e) {
      var d = document.getElementById('err'); if (!d) return;
      d.style.display = 'block';
      var ln = document.createElement('div'); ln.textContent = '⚠ ' + ((e.reason && e.reason.message) || e.reason); d.appendChild(ln);
    });
  </script>
  <script type="module" src="./cloth-npc.js"></script>
</body>
</html>
