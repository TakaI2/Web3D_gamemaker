<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Editor — 道具の持ち方</title>
  <style>
    body { margin: 0; overflow: hidden; background: #10141e; color: #cfe; font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #panel { position: fixed; right: 10px; top: 10px; width: 270px; z-index: 10; background: rgba(14,18,30,0.94);
      border: 1px solid #345; border-radius: 8px; padding: 12px; font-size: 12px; max-height: calc(100vh - 40px); overflow-y: auto; }
    #panel h3 { margin: 10px 0 4px; font-size: 12px; color: #9fe6ff; }
    #panel h3:first-child { margin-top: 0; }
    button { background: #25304a; border: 1px solid #46608c; color: #cfe; border-radius: 4px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
    button.on { background: #3d6b46; border-color: #6fae7c; }
    input, select { background: #1a2030; color: #cfe; border: 1px solid #345; border-radius: 3px; font-size: 12px; padding: 2px 4px; }
    #status { position: fixed; left: 10px; bottom: 10px; z-index: 10; background: rgba(0,0,0,0.55); padding: 5px 12px; border-radius: 5px; font-size: 12px; max-width: 70vw; }
    .row { display: flex; gap: 4px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
    label { font-size: 11px; color: #9ab; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="panel">
    <h3>🔧 道具</h3>
    <div class="row">
      <select id="tool-src" style="flex:1;">
        <option value="proc:rifle">プロシージャル: rifle</option>
        <option value="proc:shockgun">プロシージャル: shockgun</option>
      </select>
    </div>
    <div class="row">
      <input id="glb-name" list="glb-list" placeholder="または models のGLB名で検索" style="width:100%;">
      <datalist id="glb-list"></datalist>
    </div>
    <div class="row"><label>スケール</label><input id="tool-scale" type="number" step="0.05" value="1" style="width:60px;"></div>

    <h3>持ち手（メイン）</h3>
    <div class="row">
      <select id="main-bone"><option>rightHand</option><option>leftHand</option></select>
      <button id="g-tool" class="on">道具をギズモ操作</button>
    </div>
    <div class="row"><button id="btn-mode">移動⇄回転 (R)</button></div>

    <h3>添え手（IKで添える）</h3>
    <div class="row">
      <label><input id="cb-sub" type="checkbox"> 有効</label>
      <select id="sub-bone"><option>leftHand</option><option>rightHand</option></select>
      <button id="g-sub">添え手をギズモ操作</button>
    </div>

    <h3>ポーズ確認</h3>
    <div class="row">
      <select id="pose-sel" style="max-width:150px;"><option value="">Tポーズ</option></select>
      <button id="btn-pose-play">▶ 再生</button>
    </div>
    <div class="row"><input id="pose-time" type="range" min="0" max="1" step="0.01" value="0" style="width:100%;"></div>

    <h3>保存 / 読込（public/tools/）</h3>
    <div class="row">
      <input id="tool-name" value="rifle" style="width:110px;">
      <button id="btn-save">💾 保存</button>
      <button id="btn-load">読込</button>
    </div>
    <div style="font-size:10px;color:#789;margin-top:8px;">
      道具は持ち手ボーンの子。ギズモで位置/向きを調整→保存。<br>
      添え手はマゼンタ球＝IK目標（もう片方の手が添えられる）。
    </div>
  </div>
  <div id="status">読み込み中…</div>
  <script type="module" src="./tool-editor.js"></script>
</body>
</html>
