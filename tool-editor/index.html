<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tool Editor — 道具の持ち方</title>
  <style>
    body { margin: 0; overflow: hidden; background: #10141e; color: #cfe; font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #panel { position: fixed; right: 10px; top: 10px; width: 270px; z-index: 10; background: rgba(14,18,30,0.94);
      border: 1px solid #345; border-radius: 8px; padding: 12px; font-size: 12px; max-height: calc(100vh - 40px); overflow-y: auto; }
    #panel h3 { margin: 10px 0 4px; font-size: 12px; color: #9fe6ff; }
    #panel h3:first-child { margin-top: 0; }
    button { background: #25304a; border: 1px solid #46608c; color: #cfe; border-radius: 4px; padding: 4px 9px; font-size: 12px; cursor: pointer; }
    button.on { background: #3d6b46; border-color: #6fae7c; }
    input, select { background: #1a2030; color: #cfe; border: 1px solid #345; border-radius: 3px; font-size: 12px; padding: 2px 4px; }
    #status { position: fixed; left: 10px; bottom: 10px; z-index: 10; background: rgba(0,0,0,0.55); padding: 5px 12px; border-radius: 5px; font-size: 12px; max-width: 70vw; }
    .row { display: flex; gap: 4px; align-items: center; margin-top: 3px; flex-wrap: wrap; }
    label { font-size: 11px; color: #9ab; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="panel">
    <h3>🧍 キャラ</h3>
    <div class="row"><select id="npc-sel" style="width:100%;"></select></div>

    <h3>🔧 道具</h3>
    <div class="row">
      <select id="tool-src" style="flex:1;">
        <option value="proc:rifle">プロシージャル: rifle</option>
        <option value="proc:shockgun">プロシージャル: shockgun</option>
        <option value="proc:apple">プロシージャル: apple（食べ物）</option>
      </select>
    </div>
    <div class="row">
      <input id="glb-name" list="glb-list" placeholder="または models のGLB名で検索" style="width:100%;">
      <datalist id="glb-list"></datalist>
    </div>
    <div class="row"><label>スケール</label><input id="tool-scale" type="number" step="0.05" value="1" style="width:60px;"><label>握り</label><input id="tool-grip" type="range" min="0" max="1" step="0.05" value="0.8" style="width:90px;"><span id="tool-grip-v">0.8</span></div>

    <h3>持ち手（メイン）</h3>
    <div class="row">
      <select id="main-bone"><option>rightHand</option><option>leftHand</option></select>
      <button id="g-tool" class="on">道具をギズモ操作</button>
    </div>
    <div class="row"><button id="btn-mode">移動⇄回転 (R)</button></div>

    <h3>添え手（IKで添える）</h3>
    <div class="row">
      <label><input id="cb-sub" type="checkbox"> 有効</label>
      <select id="sub-bone"><option>leftHand</option><option>rightHand</option></select>
      <button id="g-sub">添え手をギズモ操作</button>
    </div>

    <h3>かぶりつき点（食べ物など）</h3>
    <div class="row">
      <label><input id="cb-bite" type="checkbox"> 有効</label>
      <button id="g-bite">かぶりつき点をギズモ操作</button>
    </div>
    <div class="row">
      <button id="g-amouth">🍴食べ点をギズモ操作</button>
      <button id="g-ainspect">👀眺め点をギズモ操作</button>
      <button id="btn-mouth-save">保存</button>
    </div>
    <div style="font-size:10px;color:#789;">食べ点=赤 / 眺め点=水色（頭に追従・位置と向きを編集可。矢印=物のかぶりつき面が向く方向）</div>

    <h3>アクション確認（IKで拾う/食べる）</h3>
    <div class="row"><label>台の高さ</label><input id="act-h" type="range" min="0" max="1" step="0.05" value="0.75" style="flex:1;"><span id="act-h-v">0.75m</span></div>
    <div class="row">
      <button id="act-pickup">拾う</button>
      <button id="act-inspect">眺める</button>
      <button id="act-eat">食べる</button>
      <button id="act-reset">戻す</button>
      <button id="act-demo">🍎 一連デモ（取る→食べる→置く）</button>
    </div>
    <div class="row" style="margin-top:4px;">
      <button id="act-pause">⏸</button>
      <input id="act-scrub" type="range" min="0" max="1" step="0.005" value="0" style="flex:1;">
      <span id="act-phase" style="font-size:10px;color:#9ab;min-width:44px;">-</span>
    </div>
    <div style="margin-top:6px;color:#9fe6ff;font-size:11px;font-weight:bold;">アクション調整（.tool.json の verbs に保存）</div>
    <div style="display:grid;grid-template-columns:auto 1fr auto 1fr;gap:2px 6px;align-items:center;font-size:11px;margin-top:3px;">
      <label>伸ばす秒</label><input id="pv-durReach" type="number" step="0.05" style="width:52px;">
      <label>運ぶ秒</label><input id="pv-durBring" type="number" step="0.05" style="width:52px;">
      <label>戻す秒</label><input id="pv-durOut" type="number" step="0.05" style="width:52px;">
      <label>齧り数</label><input id="pv-bites" type="number" step="1" style="width:52px;">
      <label>齧り周期</label><input id="pv-biteCycle" type="number" step="0.05" style="width:52px;">
    </div>
    <div class="row" style="font-size:11px;"><label>肘ヒント</label>
      外<input id="pv-el0" type="number" step="0.1" style="width:46px;">
      上下<input id="pv-el1" type="number" step="0.1" style="width:46px;">
      前後<input id="pv-el2" type="number" step="0.1" style="width:46px;">
      <span style="color:#789;">（黄矢印）</span>
    </div>

    <h3>ポーズ確認</h3>
    <div class="row">
      <select id="pose-sel" style="max-width:150px;"><option value="">Tポーズ</option></select>
      <button id="btn-pose-play">▶ 再生</button>
    </div>
    <div class="row"><input id="pose-time" type="range" min="0" max="1" step="0.01" value="0" style="width:100%;"></div>

    <h3>保存 / 読込（public/tools/）</h3>
    <div class="row">
      <input id="tool-name" value="rifle" style="width:110px;">
      <button id="btn-save">💾 保存</button>
      <button id="btn-load">読込</button>
    </div>
    <div style="font-size:10px;color:#789;margin-top:8px;">
      道具は持ち手ボーンの子。ギズモで位置/向きを調整→保存。<br>
      添え手はマゼンタ球＝IK目標（もう片方の手が添えられる）。
    </div>
  </div>
  <div id="status">読み込み中…</div>
  <script type="module" src="./tool-editor.js"></script>
</body>
</html>
