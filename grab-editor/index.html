<!DOCTYPE html>
<html lang="ja">
<head>
  <title>Grab Hit Editor — 掴み対象の当たり判定</title>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #101522; color: #e6ecf5; font-family: system-ui, sans-serif; }
    #app { position: fixed; inset: 0; }
    #app canvas { display: block; }
    #topbar { position: fixed; top: 8px; left: 8px; z-index: 20; display: flex; gap: 8px; align-items: center; }
    #topbar a, #topbar span { background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25); color: #fff; padding: 6px 12px; border-radius: 4px; font-size: 12px; text-decoration: none; }
    #panel {
      position: fixed; top: 8px; right: 8px; z-index: 20; width: 268px;
      background: rgba(12,16,28,0.94); border: 1px solid #2a3756; border-radius: 8px;
      padding: 12px; font-size: 12px; display: flex; flex-direction: column; gap: 8px;
    }
    #panel h3 { margin: 0; font-size: 13px; color: #9fd0ff; }
    #panel .hint { color: #8fa2bd; line-height: 1.5; }
    #panel select, #panel input[type=number] {
      background: #1a2438; color: #e6ecf5; border: 1px solid #2a3756; border-radius: 4px; padding: 4px 6px; font-size: 12px;
    }
    #panel select { width: 100%; }
    #panel button { background: #2b4a80; color: #fff; border: none; border-radius: 4px; padding: 7px 10px; font-size: 12px; cursor: pointer; }
    #panel button:hover { background: #3a5fa0; }
    #panel button.sub { background: #24314f; }
    .row { display: flex; gap: 6px; align-items: center; }
    .row > span.lb { width: 52px; color: #aabbd0; }
    .row input[type=number] { width: 78px; }
    .row button.stp { width: 26px; padding: 4px 0; background: #24314f; }
    #info { color: #ffd76a; min-height: 1.2em; }
    #legend { position: fixed; left: 8px; bottom: 8px; z-index: 20; background: rgba(12,16,28,0.9); border: 1px solid #2a3756; border-radius: 6px; padding: 8px 12px; font-size: 11px; color: #9fb; line-height: 1.6; }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="topbar"><a href="../hub/">← 一覧</a><span>Grab Hit Editor</span></div>
  <div id="panel">
    <h3>掴み対象の当たり判定</h3>
    <select id="kind"></select>
    <div id="meta" class="hint"></div>
    <div class="row"><span class="lb">幅 X</span><button class="stp" data-f="hx" data-d="-0.5">-</button><input type="number" id="hx" step="0.5"><button class="stp" data-f="hx" data-d="0.5">+</button></div>
    <div class="row"><span class="lb">高 Y</span><button class="stp" data-f="hy" data-d="-0.5">-</button><input type="number" id="hy" step="0.5"><button class="stp" data-f="hy" data-d="0.5">+</button></div>
    <div class="row"><span class="lb">奥 Z</span><button class="stp" data-f="hz" data-d="-0.5">-</button><input type="number" id="hz" step="0.5"><button class="stp" data-f="hz" data-d="0.5">+</button></div>
    <div class="row"><span class="lb">中心Y</span><button class="stp" data-f="cy" data-d="-0.5">-</button><input type="number" id="cy" step="0.5"><button class="stp" data-f="cy" data-d="0.5">+</button></div>
    <div class="row"><button id="fit" class="sub" style="flex:1">実寸に合わせる</button><button id="reset" class="sub" style="flex:1">保存値を破棄</button></div>
    <button id="save">grabhit.json に保存</button>
    <div id="info"></div>
    <div class="hint">保存すると City-Fly のグラブ対象へ即反映されます（起動時に読み込み）。</div>
  </div>
  <div id="legend">
    緑ワイヤー＝当たり判定（OBB）／グレー＝見た目<br>
    ドラッグ=回転　ホイール=ズーム　右ドラッグ=平行移動<br>
    赤い線＝射線テスト（クリックで撃ってみる）
  </div>
  <script type="module" src="./grab-editor.js"></script>
</body>
</html>
